name: Testing-1087

on:
  workflow_dispatch:

jobs:
  rhel10-first:
    runs-on: self-hosted
    container:
      image: redhat/ubi10
      # Mount the host's tool cache into the container so both jobs share it.
      options: --volume /opt/hostedtoolcache:/opt/hostedtoolcache
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Install tools
        run: |
          dnf -y --allowerasing install bash ca-certificates git jq tar xz file findutils
      - name: OS info
        run: |
          cat /etc/os-release
          echo "RUNNER_ENVIRONMENT='${RUNNER_ENVIRONMENT}'"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          uname -a
      - name: Setup Python
        # uses: actions/setup-python@v6
        uses: gowridurgad/setup-python@arch-suffix-v2
        with:
          python-version: '3.14'

      - name: Post-setup env
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "pythonLocation=$pythonLocation"
          find /opt/hostedtoolcache -maxdepth 4 -type d 2>/dev/null | head -50
      - name: Inspect Python
        run: |
          echo "pythonLocation=$pythonLocation"
          which python || true
          python --version || true
          python -m pip --version || true
          python -c "import sys; print(sys.executable)" || true
          python -c "import ssl; print(ssl.OPENSSL_VERSION)" || true
          ldd "$(which python)" || true
      - name: Warm cache
        run: python -m pip install --upgrade pip

  rhel9-second:
    needs: rhel10-first
    runs-on: self-hosted
    container:
      image: redhat/ubi9
      options: --volume /opt/hostedtoolcache:/opt/hostedtoolcache
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Install tools
        run: |
         dnf -y --allowerasing install bash ca-certificates git jq tar xz file findutils
      - name: OS info
        run: |
          cat /etc/os-release
          echo "RUNNER_ENVIRONMENT='${RUNNER_ENVIRONMENT}'"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          uname -a
      - name: Setup Python
        # uses: actions/setup-python@v6
        uses: gowridurgad/setup-python@arch-suffix-v2
        with:
          python-version: '3.14'

      - name: Post-setup env
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "pythonLocation=$pythonLocation"
          find /opt/hostedtoolcache -maxdepth 4 -type d 2>/dev/null | head -50
      - name: Inspect Python
        run: |
          echo "pythonLocation=$pythonLocation"
          which python || true
          python --version || true
          python -m pip --version || true
          python -c "import sys; print(sys.executable)" || true
          python -c "import ssl; print(ssl.OPENSSL_VERSION)" || true
          ldd "$(which python)" || true
      - name: Trigger bug
        run: python -m pip install --upgrade pip
